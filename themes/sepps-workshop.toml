# Sepp’s Workshop for Starship: colours only
# Generated, do not edit by hand. Source: https://github.com/sepps-workshop/sepps-workshop-starship
# The icons need a Nerd Font. Recommended: JetBrainsMono Nerd Font (https://www.nerdfonts.com/font-downloads)

command_timeout = 1000
palette = "sepps_workshop"

[palettes.sepps_workshop]
accent = "#fbba00"
info = "#80c7e7"
success = "#a2d182"
danger = "#ff897b"
fg_muted = "#b6c1d5"
warning = "#f59c00"

[directory]
style = "bold accent"

[git_branch]
style = "info"

[git_status]
format = "(\\[$all_status$ahead_behind\\] )"
conflicted = "[=$count](warning)"
ahead = "[⇡$count](fg_muted)"
behind = "[⇣$count](fg_muted)"
diverged = "[⇕⇡$ahead_count⇣$behind_count](fg_muted)"
untracked = "[?$count](success)"
stashed = "[\\$$count](fg_muted)"
modified = "[!$count](info)"
staged = "[+$count](warning)"
renamed = "[»$count](info)"
deleted = "[✘$count](danger)"

[character]
success_symbol = "[❯](success)"
error_symbol = "[✗](danger)"

[cmd_duration]
style = "fg_muted"

